<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prescera</title>
<meta name="description" content="Prescera is building cybersecurity intelligence.">
<meta property="og:title" content="Prescera">
<meta property="og:description" content="Prescera is building cybersecurity intelligence.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b0e14'/><path d='M16 5l9 3.6v7.2c0 5.6-3.7 9.6-9 11.2-5.3-1.6-9-5.6-9-11.2V8.6z' fill='none' stroke='%2364f0c8' stroke-width='2.2' stroke-linejoin='round'/></svg>">
<style>
  :root {
    --bg: #07090e;
    --fg: #e8ecf3;
    --muted: #8b95a8;
    --accent: #5ef0c4;
    --line: rgba(255,255,255,.09);
    /* apex of the light cone: the present moment, opening toward what's ahead */
    --apex-x: -6%;
    --apex-y: 50%;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100%;
    position: relative;
    overflow-x: hidden;
  }
  /* the cone itself: a wedge of light widening left to right, teal at its
     upper edge cooling to blue at the lower one */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      conic-gradient(from 0deg at var(--apex-x) var(--apex-y),
        transparent 0deg 58deg,
        rgba(94,240,196,0) 62deg,
        rgba(94,240,196,.15) 81deg,
        rgba(127,178,255,.12) 101deg,
        rgba(127,178,255,0) 121deg,
        transparent 124deg 360deg),
      radial-gradient(560px 560px at var(--apex-x) var(--apex-y), rgba(94,240,196,.12), transparent 66%);
    pointer-events: none;
  }
  /* the grid reads as structure the cone lights up: crisp inside it, a ghost outside */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    --cone-mask: conic-gradient(from 0deg at var(--apex-x) var(--apex-y),
      rgba(0,0,0,.12) 0deg 56deg,
      #000 82deg 100deg,
      rgba(0,0,0,.12) 126deg 360deg);
    mask-image: var(--cone-mask);
    -webkit-mask-image: var(--cone-mask);
    opacity: .55;
    pointer-events: none;
  }
  /* distance falloff: everything dims the further it sits from the present */
  .veil {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: radial-gradient(135% 115% at var(--apex-x) var(--apex-y),
      transparent 0%, transparent 32%, rgba(7,9,14,.55) 64%, var(--bg) 94%);
    pointer-events: none;
  }
  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 780px;
    margin: 0 auto;
    padding: 0 24px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  header { padding: 34px 0; }
  .wordmark {
    font-weight: 600;
    letter-spacing: .16em;
    font-size: 14px;
    text-transform: uppercase;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 0 90px;
  }
  h1 {
    font-size: clamp(2.6rem, 8vw, 4.6rem);
    line-height: 1.04;
    letter-spacing: -.035em;
    font-weight: 600;
    margin: 0;
  }
  h1 .grad {
    background: linear-gradient(100deg, var(--accent), #7fb2ff 70%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  footer {
    position: relative;
    z-index: 1;
    border-top: 1px solid var(--line);
    padding: 22px 0;
    font-size: .82rem;
    color: var(--muted);
  }
  @media (max-width: 520px) {
    main { padding: 24px 0 64px; }
    :root { --apex-x: -22%; }
  }
</style>
</head>
<body>
  <div class="veil"></div>

  <div class="wrap">
    <header>
      <span class="wordmark">Prescera</span>
    </header>

    <main>
      <h1>We are building <span class="grad">cybersecurity intelligence</span>.</h1>
    </main>
  </div>

  <div class="wrap" style="flex:none">
    <footer>
      <span>&copy; <span id="yr">2026</span> Arivos Private Limited. All rights reserved.</span>
    </footer>
  </div>

  <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
